    procedures_templates:
      server: "**Server.** The system runs %{location} at [location, e.g. the owner's home or a hosting provider]. Its data (the database, the uploaded files and the nightly verified database copies) is on that server's storage volume. Only [the owner] has administrative access to the server."
      server_docker: as a Docker container on a server
      server_plain: on a server
      network: "**Network access.** [How the system is reached: e.g. directly from the internet at its own address, only on the home network, or over a VPN.] %{https}"
      sign_in: "**Sign-in.** %{sentence} Password accounts require at least %{min} characters, reject passwords found in known data breaches, lock for %{minutes} minutes after %{tries} failed attempts in a row, and can add an authenticator app. Sessions end after %{days} days unused."
      signing: "**Signing.** Signing an entry always requires the signer to re-enter their password (and authenticator code if enabled)."
      signing_sso: "**Signing.** Signing an entry always requires the signer to re-enter their password (and authenticator code if enabled) or to sign in again with single sign-on."
      updates: "**Updates.** Software updates are installed by [the owner] from [the project's published container images]. Each version is recorded by the system under Software versions."
      secret_key: "**Secret key.** The application secret key (SECRET_KEY_BASE), needed to verify electronic signatures and to restore from backup, is kept by the owner off the server in [a password manager]."
      who_makes_entries: "**Who makes entries.** The owner enters maintenance records. A mechanic who performs work signs their own entry: through a signing invitation, with their own account in the system, or by signing a printed entry in ink. The owner signs only preventive maintenance they performed under 14 CFR 43.3(g), with their pilot certificate."
      outside_signers: "**Outside signers.** Signing invitations are sent only to the mechanic's own email address, for the specific entry they performed. Each invitation can be used once and expires after 14 days. If a mechanic forgets their password, the owner resets it or sends a new invitation; passwords are never shared or set on a mechanic's behalf. Mechanics are encouraged to add an authenticator app. Accounts of mechanics no longer working on the aircraft are disabled at the next audit; their past signatures remain valid."
      account_problems: "**Account problems.** If someone may have used another person's password, or an account is locked without explanation, the owner disables or unlocks it as appropriate, has the user change their password, and reviews the record history for changes made by that account. An authenticator app is reset only after confirming the person's identity by phone or in person."
      share_links: "**Share links.** Read-only share links are created only for a specific purpose (a mechanic, buyer, insurer or the FAA), with an expiry date where practical. They are revoked when no longer needed and reviewed at each audit."
      retention: "**Retention (14 CFR 91.417(b)).** Records of maintenance, preventive maintenance and alterations, and of 100-hour, annual and progressive inspections, are kept until the work is repeated or superseded, or for one year after it was performed. Total time in service, current status of life-limited parts, time since last overhaul, current inspection status and AD status are kept permanently and transferred with the aircraft. In practice nothing is deleted: signed entries cannot be deleted, and the record history and off-site copies are kept."
      paper_records: "**Paper records.** The paper logbooks covering the period before %{since} are kept by the owner at [location] and transferred with the aircraft. Their scans are marked as legacy records. Entries signed in ink after that date are scanned into Documents, and the paper is kept with the logbooks."
      since_blank: "[the date electronic records began]"
      shop_visits: "**Shop visits.** When a shop prefers paper, entries are printed from the system for signature and the signed copy is scanned in. A shop or the FAA may be given a time-limited Maintenance Detail share link for read-only access."
      sale: "**Sale of the aircraft.** The owner gives the buyer the paper logbooks and a records package from the system (the entries with their signatures, the record history, the procedures and the data archive)."
      https_on: 'Connections use HTTPS only: the system redirects plain HTTP and marks its cookies secure.'
      https_off: 'The system is set not to enforce HTTPS itself (FORCE_SSL=false): [say how connections are protected, e.g. a TLS proxy in front, or the home network only].'
      sign_in_sso_only: People sign in only with single sign-on (%{provider}); password sign-in is turned off.
      sign_in_sso: People sign in with single sign-on (%{provider}) or with their own email and password; there are no shared accounts.
      sign_in_password: People sign in with their own email and password; there are no shared accounts.
