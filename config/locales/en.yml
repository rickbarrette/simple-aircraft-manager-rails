    procedures:
      document:
        standalone_procedures_document_ac_120: Standalone procedures document · AC 120-78B paragraphs 2.2.11 and 3.2.8
        electronic_signature_and_recordkeeping_procedure: Electronic Signature and Recordkeeping Procedures
        simple_aircraft_manager_html: "%{operator} · Simple Aircraft Manager"
        revision_html: "<strong>Revision %{number}</strong>%{adopted}"
        n1_purpose_and_scope: 1. Purpose and scope
        these_procedures_describe_how_keeps_html: These procedures describe how %{operator} keeps the maintenance records required by 14 CFR 91.417 electronically in Simple Aircraft Manager, and how entries are signed electronically under 14 CFR 43.9 and 43.11. They follow FAA AC 120-78B. Under its paragraph 1.9.5, use of electronic signatures and recordkeeping under part 91 (other than subpart K) needs no FAA approval, acceptance or authorization; the FAA recommends following the AC, and these procedures do.
        aircraft: Aircraft
        serial_number: Serial number
        electronic_records_since: Electronic records since
        earlier_records: Earlier records
        paper_logbooks_html: Paper logbooks%{legacy}
        records_kept_electronically_logbook_entries: 'Records kept electronically: logbook entries (maintenance, preventive maintenance, inspections, alterations), inspection status and history, airworthiness directive compliance, component times and life limits, major repairs and alterations with their Form 337s, weight and balance, and supporting documents. Paper logbooks from before the date above remain the record for that period and are kept.'
        n2_regulatory_compliance: 2. Regulatory compliance
        each_logbook_entry_carries_what: 'Each logbook entry carries what 14 CFR 43.9 requires (description of the work, date, the name, certificate number and kind of certificate of the person approving return to service, and their signature) and, for inspections, what 43.11 requires (type and extent of inspection, aircraft time in service, and the airworthiness statement or discrepancy list). The app flags entries missing any of these. Records include the key elements of AC 120-78B 3.1.1: the event, when (date, and the signature''s time), where (location), who, the signature, and the make, model and serial of the aircraft, engine, propeller and components. The status required by 91.417(a)(2) is produced by the maintenance status report. Records are made available under 91.417(c) and transferred under 91.419 as described in sections 9 and 10.'
        n3_system_description: 3. System description
        software_simple_aircraft_manager_version_html: "<strong>Software:</strong> Simple Aircraft Manager, version %{version_label} (Ruby %{ruby}, Rails %{rails}, SQLite %{sqlite})."
        hosting_and_network_html: "<strong>Hosting and network:</strong>"
        describe_the_server_location_and: "[describe the server, location and network]"
        data_one_sqlite_database_plus_html: "<strong>Data:</strong> one SQLite database plus uploaded files (stored once per identical file) on the server's storage volume."
        backups_every_night_the_app_html: "<strong>Backups:</strong> every night the app makes a verified copy of the database in the storage volume (SQLite integrity check and record counts compared) and keeps the newest %{backups_kept}. Off-site:"
        after_each_nightly_backup_the_html: after each nightly backup the app copies the verified database snapshot (compressed) to Google Drive (account %{account_email}, folder “%{folder}”), keeping the newest %{offsite_backups_kept}, together with every uploaded file (scans, documents, attachments) not already copied; files are never deleted from the off-site copy. A failed copy is emailed to the administrators. A restore test downloads the newest copy, opens it and checks it, and checks a sample of files against their checksums.%{present}
        n4_responsible_personnel: 4. Responsible personnel
        has_authority_and_overall_responsibility_html: "%{name}%{title}, has authority and overall responsibility for the electronic signature process and the recordkeeping system, for controlling access to it (accounts, roles, disabling accounts), and for the quality-control audits. Administrators: %{admins}."
        n5_defined_users_and_roles: 5. Defined users and roles
        owners_keep_an_aircraft_s_html: 'Owners keep an aircraft''s records; pilots can view them and record flights, squawks and preventive maintenance. A user may sign entries with a current certificate on their profile: mechanic certificates (A&amp;P, IA, airframe, powerplant, repair station, repairman) for maintenance and inspection entries; a pilot certificate for preventive maintenance only. Disabled accounts can''t sign in or sign.'
        user: User
        roles: Roles
        certificates: Certificates
        may_sign: May sign
        people_outside_these_users_e: People outside these users (e.g. a mechanic who did the work) sign through a one-time email invitation from an owner, with their own account and certificate, for that entry only; or they sign on paper (section 11).
        n6_electronic_signature_process: 6. Electronic signature process
        the_signer_opens_the_entry: The signer opens the entry and chooses Sign. The entry is shown in full exactly as it will be certified (AC 2.2.4).
        they_choose_one_of_their: 'They choose one of their own current certificates. The statement they will certify is shown with it, under the heading “Certified by” (2.2.2): for maintenance, “I certify that the work described in this entry was performed in accordance with 14 CFR Part 43, and I approve it for return to service with respect to that work”; for inspections, the 43.11(a)(5) statement; for preventive maintenance by a pilot, the corresponding statement.'
        they_prove_who_they_are: 'They prove who they are again: their password (with a code from their authenticator app, if they use one), or signing in again with single sign-on within the last five minutes (2.2.6), and confirm that they are signing with intent to sign (2.1.2.4–5).'
        the_system_records_the_signer: The system records the signer, the certificate (kind and number), the statement, the time (UTC), how they authenticated, their network address and browser, a SHA-256 fingerprint of the entry's content and a readable copy of it, and a server seal (HMAC) over the signature record (2.1.2.6, 2.2.5). The signer is told on screen and by email (2.2.3).
        once_signed_the_entry_and: Once signed, the entry and its components can't be edited or deleted (2.1.2.7–8, 2.2.7). A correction is made as a new entry that, once signed, supersedes the original; the original and its signature are kept and marked superseded (2.2.8).
        when_someone_no_longer_needs: 'When someone no longer needs access, the responsible person disables their account: they can no longer sign in or sign, and their past signatures stay valid (2.2.6.4).'
        signed_records_are_archived_in: Signed records are archived in the database, its nightly verified copies and the off-site backup, and can be exported with their signatures (2.2.9).
        n7_recordkeeping_system_controls: 7. Recordkeeping system controls
        controlled_access_3_2_1_html: "<strong>Controlled access (3.2.1):</strong> personal accounts (%{password}); roles per aircraft; passwords of at least 12 characters, refused if known from a data breach; optional authenticator-app codes; accounts locked for 15 minutes after 10 failed sign-ins (the user is emailed); rate-limited sign-in; sessions end after 30 days unused; changing an email or password needs the current password."
        record_preservation_3_2_2_html: "<strong>Record preservation (3.2.2):</strong> every change to a maintenance record is kept with who, when and what changed, in a hash chain per aircraft that can't be edited; signed entries are locked."
        confidential_information_3_2_3_html: "<strong>Confidential information (3.2.3):</strong> records are visible only to the aircraft's users, and to share links an owner creates (scoped and optionally expiring)."
        data_corruption_3_2_4_html: "<strong>Data corruption (3.2.4):</strong> nightly, the history chains and every signature's seal and fingerprint are checked; administrators are emailed on any problem."
        outages_3_2_5_entries_html: "<strong>Outages (3.2.5):</strong> entries are made on paper and signed in ink during an outage (section 13); the database is restored from the latest verified copy or the off-site backup."
        software_revision_control_3_2_html: "<strong>Software revision control (3.2.6):</strong> the software is updated by deploying a new release built from its source repository. Each release has a version (year.month.release, e.g. 2026.11.0) and a build (the exact source commit), with release notes describing what changed (What's new); each version and when it ran is recorded by the system. Before an update that changes how records are entered, displayed or accessed, the responsible person reviews it, and these procedures are revised if they're affected."
        backups_3_2_7_see_html: "<strong>Backups (3.2.7):</strong> see section 3."
        n8_quality_control_and_auditing: 8. Quality control and auditing
        every_months_the_responsible_person_html: Every %{audit_interval_months} months the responsible person carries out and records an audit in the system (3.2.8.5). The app checks that the integrity check and backups are passing, the procedures are adopted, signatures are intact, and lists expired certificates and software versions since the last audit. The auditor restores the off-site backup somewhere separate and opens it, compares %{audit_sample_size} randomly chosen entries with their work orders or source documents, reviews the users and roles (disabling accounts no longer needed), and confirms the paper logbooks are kept. Audit results are kept in the system.%{latest}
        n9_making_records_available_to: 9. Making records available to the FAA and NTSB
        on_request_14_cfr_91: 'On request (14 CFR 91.417(c), 49 CFR 830), the responsible person provides the records package for the aircraft: every logbook entry as a PDF with its electronic signature, a signature register, the full change history, the maintenance status report and the data archive, with a README. Printed copies are produced the same way. Direct access to the system can be offered but isn''t required (3.2.8.6).'
        n10_transfer_of_records: 10. Transfer of records
        at_sale_91_419_3_html: "<strong>At sale (91.419, 3.2.8.12):</strong> the buyer receives the records package and the data archive, which another installation of the system can import, together with the paper logbooks. <strong>To another system (3.2.8.9):</strong> records are exported as the data archive and the records package; both systems run side by side until the transfer is checked."
        n11_continuity: 11. Continuity
        legacy_records_3_2_8_html: "<strong>Legacy records (3.2.8.10):</strong> records before the dates in section 1 are the paper logbooks, which are kept; scans are held as legacy records for reference. <strong>Maintenance providers (3.2.8.11):</strong> a provider signs electronically through an invitation, or signs a printed entry in ink; the signed paper is kept with the logbooks and scanned into the system."
        n12_changes_to_the_system: 12. Changes to the system and these procedures
        these_procedures_are_revised_when: These procedures are revised when the system or its use changes. Each revision is numbered, dated and adopted in the system by an administrator; earlier revisions are kept. Under AC 120-78B 1.9.5 no submission to the FAA is required for part 91 operations (3.2.8.13).
        n13_user_instructions_and_training: 13. User instructions and training
        every_user_who_keeps_or: Every user who keeps or signs records reads these instructions (also in the system under “How electronic records work”) before signing (2.2.12, 3.2.9).
        n14_additional_procedures: 14. Additional procedures
