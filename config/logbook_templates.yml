# Built-in logbook templates: common preventive maintenance a pilot may do on
# an aircraft they own or operate (14 CFR 43.3(g)), keyed to Part 43 Appendix A
# paragraph (c). Descriptions are paraphrased; the rule sets each item's limits.
# Admins can edit these and add their own (Admin -> Logbook templates).
- name: "Oil and filter change"
  log_type: ENG
  reference: "Part 43 App. A (c)(6), (c)(23)"
  text: "Drained engine oil and replaced the oil filter. Cut open and inspected the filter: no metal found. Refilled with __ qt of __. Ran engine and checked for leaks. Preventive maintenance per 14 CFR 43.3(g), Part 43 Appendix A paragraph (c)(6) and (c)(23)."
  certificate_type: PILOT
- name: "Tire removal, installation or repair"
  reference: "Part 43 App. A (c)(1)"
  text: "Removed and replaced the __ tire and tube. Inflated to __ psi. Preventive maintenance per 14 CFR 43.3(g), Part 43 Appendix A paragraph (c)(1)."
  certificate_type: PILOT
- name: "Servicing landing gear shock struts"
  reference: "Part 43 App. A (c)(3)"
  text: "Serviced the __ shock strut with __. Preventive maintenance per 14 CFR 43.3(g), Part 43 Appendix A paragraph (c)(3)."
  certificate_type: PILOT
- name: "Servicing wheel bearings"
  reference: "Part 43 App. A (c)(4)"
  text: "Cleaned, inspected and repacked the __ wheel bearings with __ grease. Preventive maintenance per 14 CFR 43.3(g), Part 43 Appendix A paragraph (c)(4)."
  certificate_type: PILOT
