production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  purge_abandoned_uploads:
    command: "ActiveStorage::Blob.unattached.where(created_at: ..2.days.ago).find_each(&:purge_later)"
    schedule: every day at 4am
  dedupe_storage:
    command: "ActiveStorage::Blob.service.try(:sweep)"
    schedule: every day at 4:30am
  weekly_reminders:
    class: WeeklyReminderJob
    schedule: every monday at 12pm
  ad_watch:
    class: AdWatchJob
    schedule: every sunday at 10am
