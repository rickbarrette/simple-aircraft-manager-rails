# Simplest self-hosting, built from this checkout: one container, SQLite and
# uploads in a named volume. To run a published image instead, see
# docker-compose.image.yml; behind Traefik (and Authentik), docker-compose.traefik.yml.
#
#   cp .env.example .env   # set SECRET_KEY_BASE (bin/rails secret), APP_HOST, FORCE_SSL
#   docker compose up -d --build
#   open http://localhost:3000  → create the admin account
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file: .env
    environment:
      SOLID_QUEUE_IN_PUMA: "true"   # background jobs run inside the web process
    volumes:
      - sam_storage:/rails/storage  # databases + uploaded files: back this up
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  sam_storage:
