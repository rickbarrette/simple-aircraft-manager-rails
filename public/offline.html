<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Offline · Simple Aircraft Manager</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --page: #f1f5f9; --surface: #fff; --text: #1e293b; --muted: #64748b; --accent: #0369a1; }
    @media (prefers-color-scheme: dark) {
      :root { --page: #0b1220; --surface: #0f172a; --text: #e2e8f0; --muted: #94a3b8; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--page); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 26rem; width: 100%; background: var(--surface); border-radius: 12px; padding: 32px 24px; text-align: center;
           box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="">
    <h1>You're offline</h1>
    <p>Simple Aircraft Manager needs a connection to load your aircraft. Check your signal and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload() })</script>
</body>
</html>
